<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgOpen router</title>
<style>
  body { font-family: sans-serif; max-width: 1100px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { font-size: 1.3em; }
  h2 { font-size: 1.1em; margin-top: 2em; }
  label { display: block; margin-top: 0.8em; font-size: 0.9em; }
  input, select { width: 100%; box-sizing: border-box; padding: 0.4em; margin-top: 0.2em; font-size: 1em; }
  button { margin-top: 1em; padding: 0.5em 1.2em; font-size: 1em; }
  #wifi-msg { margin-top: 0.6em; font-size: 0.9em; }
  #wifi-msg.error { color: #b00020; }
  #wifi-msg.ok { color: #0a7a2f; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.8em; font-size: 0.9em; }
  th, td { text-align: left; padding: 0.4em 0.5em; border-bottom: 1px solid #ddd; }
  .panel table th { white-space: nowrap; }
  td.mac, td.ip { font-family: monospace; }
  tr.stale { color: #999; }
  tr.stale .rate::after { content: " (idle)"; font-size: 0.85em; }
  #banner { display: none; background: #b00020; color: #fff; padding: 0.6em 1em; border-radius: 4px; margin-bottom: 1em; }
  #banner.show { display: block; }
  #banner.restarting { background: #c26a00; }
  tr.selected { background: #eef4fc; }
  button.watch-btn { margin: 0; padding: 0.2em 0.6em; font-size: 0.85em; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5em; margin-top: 1.5em; }
  .panel { border: 2px solid #888; border-radius: 4px; padding: 0.8em; }
  .panel h2 { margin-top: 0; }
  .panel-wide { grid-column: 1 / -1; }
  #chart-panel {
    --chart-rx: #2a78d6; --chart-tx: #eb6834;
    --chart-grid: #e1e0d9; --chart-axis: #c3c2b7; --chart-muted: #898781;
    display: none; margin-top: 0.8em; border: 2px solid #888; border-radius: 4px; padding: 0.8em;
  }
  #chart-panel.show { display: block; }
  #chart-panel .chart-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.9em; }
  #chart-legend .legend-item { margin-right: 1em; color: var(--chart-muted); }
  #chart-legend .legend-item i { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 2px; margin-right: 0.3em; }
  #traffic-canvas { width: 100%; height: 160px; display: block; margin-top: 0.4em; cursor: crosshair; }
  #chart-tooltip { font-size: 0.85em; color: var(--chart-muted); height: 1.2em; margin-top: 0.2em; }
  #ota-progress { width: 100%; margin-top: 0.8em; height: 1.2em; display: none; }
  #ota-progress.show { display: block; }
  #ota-msg { margin-top: 0.6em; font-size: 0.9em; }
  #ota-msg.error { color: #b00020; }
  #ota-msg.ok { color: #0a7a2f; }
  #sys-drops.warn { color: #b00020; font-weight: 600; }
</style>
</head>
<body>

<div id="banner">Lost connection to bridge &mdash; retrying&hellip;</div>

<h1>AgOpen router <span id="fw-version" style="font-size: 0.5em; color: #898781; font-weight: normal;"></span></h1>

<div class="panels">

<div class="panel">
<h2>WiFi</h2>
<form id="wifi-form">
  <label for="ssid">Network name (SSID)</label>
  <input type="text" id="ssid" maxlength="31" required>

  <label for="password">Password (leave blank to keep the current password)</label>
  <input type="password" id="password" maxlength="63" autocomplete="new-password">

  <label for="channel">Channel</label>
  <select id="channel">
    <option value="1">1</option>
    <option value="6">6</option>
    <option value="11">11</option>
  </select>

  <button type="submit">Save &amp; apply</button>
  <div id="wifi-msg"></div>
</form>
</div>

<div class="panel">
<h2>Firmware update</h2>
<form id="ota-form">
  <label for="ota-file">Firmware image (.bin)</label>
  <input type="file" id="ota-file" accept=".bin">

  <button type="submit" id="ota-submit" disabled>Upload &amp; flash</button>
  <progress id="ota-progress" value="0" max="100"></progress>
  <div id="ota-msg"></div>
</form>
<p style="margin-top: 1.2em; margin-bottom: 0;"><strong>Change admin login</strong></p>
<button type="button" id="admin-login-btn">Update username &amp; password</button>
</div>

<div class="panel">
<h2>System</h2>
<table>
  <tbody>
    <tr><th>Uptime</th><td id="sys-uptime">&hellip;</td></tr>
    <tr><th>Free heap</th><td id="sys-heap">&hellip;</td></tr>
    <tr><th>CPU (core 0 / 1)</th><td id="sys-cpu">&hellip;</td></tr>
    <tr><th title="Measured from the CPU cycle counter timed against esp_timer_get_time(), independent of the configured clock setting.">CPU speed</th><td id="sys-cpu-freq" title="Measured from the CPU cycle counter timed against esp_timer_get_time(), independent of the configured clock setting.">&hellip;</td></tr>
    <tr><th>Network (up / down)</th><td id="sys-net">&hellip;</td></tr>
    <tr><th>Clients</th><td id="sys-clients">&hellip;</td></tr>
    <tr><th title="Missed bandwidth samples since boot — a rising count means traffic accounting is falling behind under load. Does not mean the bridge is actually dropping network packets.">Unreported traffic</th><td id="sys-drops" title="Missed bandwidth samples since boot — a rising count means traffic accounting is falling behind under load. Does not mean the bridge is actually dropping network packets.">&hellip;</td></tr>
  </tbody>
</table>
</div>

<div class="panel panel-wide">
<h2>Connected clients</h2>
<table>
  <thead>
    <tr><th>Name</th><th>MAC</th><th>IP</th><th>Link</th><th>Signal</th><th>Down</th><th>Up</th><th></th></tr>
  </thead>
  <tbody id="clients-body">
    <tr><td colspan="8">Loading&hellip;</td></tr>
  </tbody>
</table>
</div>

</div>

<div id="chart-panel">
  <div class="chart-head">
    <div id="chart-legend">
      <span class="legend-item"><i style="background:var(--chart-rx)"></i>Down (rx)</span>
      <span class="legend-item"><i style="background:var(--chart-tx)"></i>Up (tx)</span>
    </div>
    <div><span id="chart-title"></span> &ndash; <button type="button" id="chart-pause">Pause</button> <button type="button" id="chart-stop">Stop</button></div>
  </div>
  <canvas id="traffic-canvas" width="600" height="160"></canvas>
  <div id="chart-tooltip"></div>
</div>

<script>
// The whole site sits behind HTTP Basic Auth (see check_admin_auth() in
// web_server.c) - the browser's native login prompt collects credentials
// on the first request and attaches them to every request after that, so
// there's no client-side login code here at all.

function formatRate(bytesPerSec) {
  if (bytesPerSec >= 1024 * 1024) return (bytesPerSec / (1024 * 1024)).toFixed(1) + '\u00A0MB/s';
  if (bytesPerSec >= 1024) return (bytesPerSec / 1024).toFixed(1) + '\u00A0KB/s';
  return bytesPerSec + '\u00A0B/s';
}

function formatBytes(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + '\u00A0MB';
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + '\u00A0KB';
  return bytes + '\u00A0B';
}

function formatUptime(seconds) {
  const d = Math.floor(seconds / 86400);
  const h = Math.floor((seconds % 86400) / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + (seconds % 60) + 's';
}

// Plain fetch() only rejects on a hard network error (refused, DNS, abort) -
// if the bridge stops responding without tearing down the TCP connection
// (crash, reboot), the browser can sit on the OS's default connect timeout
// for a minute or more before it ever rejects. Bound it explicitly so the
// polling loop below fails on a predictable schedule instead.
async function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function loadStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  document.getElementById('ssid').value = data.ssid;
  document.getElementById('channel').value = data.channel;
}

async function refreshClients() {
  const res = await fetchWithTimeout('/api/clients', {}, 1500);
  const clients = await res.json();
  const body = document.getElementById('clients-body');
  body.innerHTML = '';
  if (clients.length === 0) {
    body.innerHTML = '<tr><td colspan="8">No clients seen yet</td></tr>';
    return;
  }
  for (const c of clients) {
    const tr = document.createElement('tr');
    tr.className = (c.last_seen_s > 30 ? 'stale ' : '') + (c.mac === selectedMac ? 'selected' : '');
    tr.innerHTML =
      '<td>' + (c.name ? c.name : '&ndash;') + '</td>' +
      '<td class="mac">' + c.mac + '</td>' +
      '<td class="ip">' + c.ip + '</td>' +
      '<td>' + c.link + '</td>' +
      '<td>' + (c.rssi === null ? '&ndash;' : c.rssi + ' dBm') + '</td>' +
      '<td class="rate">' + formatRate(c.rx_bps) + '</td>' +
      '<td class="rate">' + formatRate(c.tx_bps) + '</td>' +
      '<td><button type="button" class="watch-btn" data-mac="' + c.mac + '">' +
        (c.mac === selectedMac ? 'Watching' : 'Graph') + '</button></td>';
    body.appendChild(tr);
  }
}

// --- Single-client traffic graph -------------------------------------------
//
// The device already samples every tracked client's byte counters every
// 100ms and keeps a short ring buffer per client (see client_track.c) - this
// just polls that buffer at the same 1s cadence as everything else on the
// page and appends the new (sub-1-second-resolution) samples client-side, so
// short bursts between polls still show up instead of being averaged away.
let selectedMac = null;
let lastSeq = 0;
let histRx = [];
let histTx = [];
let paused = false;
let samplePeriodMs = 100;
const HISTORY_VIEW_SAMPLES = 300; // ~30s at the device's 100ms sample period

function selectClient(mac) {
  selectedMac = mac;
  lastSeq = 0;
  histRx = [];
  histTx = [];
  paused = false;
  document.getElementById('chart-pause').textContent = 'Pause';
  document.getElementById('chart-title').textContent = mac;
  document.getElementById('chart-tooltip').textContent = '';
  document.getElementById('chart-panel').classList.add('show');
  drawChart();
}

function stopWatching() {
  selectedMac = null;
  document.getElementById('chart-panel').classList.remove('show');
}

document.getElementById('clients-body').addEventListener('click', (e) => {
  const btn = e.target.closest('.watch-btn');
  if (btn) selectClient(btn.dataset.mac);
});
document.getElementById('chart-stop').addEventListener('click', stopWatching);
document.getElementById('chart-pause').addEventListener('click', (e) => {
  paused = !paused;
  e.target.textContent = paused ? 'Resume' : 'Pause';
});

// While paused, the graph stops polling for new samples so the frozen
// trace stays put under the cursor - otherwise the 1s poll loop would
// redraw over the hover crosshair/tooltip before it could be read.
async function refreshHistory() {
  if (!selectedMac || document.hidden || paused) return;
  try {
    const res = await fetchWithTimeout(
      '/api/client/history?mac=' + selectedMac + '&since=' + lastSeq, {}, 1500);
    if (!res.ok) {
      document.getElementById('chart-tooltip').textContent =
        res.status === 404 ? 'Client no longer active' : 'Graph error (' + res.status + ')';
      return;
    }
    const data = await res.json();
    if (data.reset) {
      histRx = [];
      histTx = [];
    }
    histRx.push(...data.rx);
    histTx.push(...data.tx);
    if (histRx.length > HISTORY_VIEW_SAMPLES) {
      histRx = histRx.slice(histRx.length - HISTORY_VIEW_SAMPLES);
      histTx = histTx.slice(histTx.length - HISTORY_VIEW_SAMPLES);
    }
    lastSeq = data.seq;
    samplePeriodMs = data.period_ms;
    drawChart();
  } catch (e) {
    // Same soft-fail as the rest of poll() - the connection-lost banner
    // already covers reporting this to the user.
  }
}

function drawChart(hoverX) {
  const canvas = document.getElementById('traffic-canvas');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 600, cssH = canvas.clientHeight || 160;
  if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const padL = 44, padR = 8, padT = 8, padB = 16;
  const plotW = cssW - padL - padR, plotH = cssH - padT - padB;
  const n = Math.max(histRx.length, histTx.length);

  const style = getComputedStyle(document.getElementById('chart-panel'));
  const gridColor = style.getPropertyValue('--chart-grid').trim();
  const axisColor = style.getPropertyValue('--chart-axis').trim();
  const mutedColor = style.getPropertyValue('--chart-muted').trim();
  const rxColor = style.getPropertyValue('--chart-rx').trim();
  const txColor = style.getPropertyValue('--chart-tx').trim();

  let maxVal = 1;
  for (const v of histRx) if (v > maxVal) maxVal = v;
  for (const v of histTx) if (v > maxVal) maxVal = v;
  maxVal *= 1.15;

  // Gridlines + y-axis rate labels (0 / mid / max).
  ctx.strokeStyle = gridColor;
  ctx.fillStyle = mutedColor;
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  [0, 0.5, 1].forEach((frac) => {
    const y = padT + plotH * (1 - frac);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();
    ctx.fillText(formatRate(Math.round(maxVal * frac)), padL - 6, y);
  });
  ctx.strokeStyle = axisColor;
  ctx.beginPath();
  ctx.moveTo(padL, padT + plotH);
  ctx.lineTo(padL + plotW, padT + plotH);
  ctx.stroke();

  if (n < 2) {
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for data…', padL + plotW / 2, padT + plotH / 2);
    return;
  }

  const xAt = (i) => padL + (plotW * i) / (HISTORY_VIEW_SAMPLES - 1);
  const yAt = (v) => padT + plotH * (1 - v / maxVal);

  function drawSeries(series, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const offset = HISTORY_VIEW_SAMPLES - series.length;
    series.forEach((v, i) => {
      const x = xAt(offset + i), y = yAt(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  drawSeries(histRx, rxColor);
  drawSeries(histTx, txColor);

  // x-axis time-span labels (device sample period, not wall-clock timestamps).
  const spanS = (HISTORY_VIEW_SAMPLES * samplePeriodMs) / 1000;
  ctx.fillStyle = mutedColor;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText('-' + spanS + 's', padL, padT + plotH + 2);
  ctx.textAlign = 'right';
  ctx.fillText('now', padL + plotW, padT + plotH + 2);

  // Hover crosshair + point readout.
  if (hoverX !== undefined) {
    const offsetRx = HISTORY_VIEW_SAMPLES - histRx.length;
    const idx = Math.round(((hoverX - padL) / plotW) * (HISTORY_VIEW_SAMPLES - 1)) - offsetRx;
    if (idx >= 0 && idx < histRx.length) {
      const x = xAt(offsetRx + idx);
      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      const agoS = (((histRx.length - 1 - idx) * samplePeriodMs) / 1000).toFixed(1);
      document.getElementById('chart-tooltip').textContent =
        '-' + agoS + 's:  down ' + formatRate(histRx[idx]) + '   up ' + formatRate(histTx[idx]);
    }
  }
}

const trafficCanvas = document.getElementById('traffic-canvas');
trafficCanvas.addEventListener('mousemove', (e) => {
  const rect = trafficCanvas.getBoundingClientRect();
  drawChart(e.clientX - rect.left);
});
trafficCanvas.addEventListener('mouseleave', () => {
  document.getElementById('chart-tooltip').textContent = '';
  drawChart();
});

async function refreshSystem() {
  const res = await fetchWithTimeout('/api/system', {}, 1500);
  const s = await res.json();
  document.getElementById('sys-uptime').textContent = formatUptime(s.uptime_s);
  document.getElementById('sys-heap').innerHTML =
    formatBytes(s.free_heap) + '<br>(min\u00A0' + formatBytes(s.min_free_heap) + ')';
  document.getElementById('sys-cpu').textContent = s.cpu_pct[0] + '% / ' + s.cpu_pct[1] + '%';
  document.getElementById('sys-cpu-freq').textContent = s.cpu_freq_mhz ? s.cpu_freq_mhz + ' MHz' : '…';
  document.getElementById('sys-net').innerHTML =
    formatRate(s.net_tx_bps) + '<br>' + formatRate(s.net_rx_bps);
  document.getElementById('sys-clients').textContent = s.client_count;
  const dropsEl = document.getElementById('sys-drops');
  dropsEl.textContent = s.traffic_drops;
  dropsEl.classList.toggle('warn', s.traffic_drops > 0);
  document.getElementById('fw-version').textContent = s.version ? 'Rev ' + s.version : '';
}

let failCount = 0;
let otaUploading = false;
async function poll() {
  if (otaUploading) return;
  try {
    await refreshClients();
    await refreshSystem();
    await refreshHistory();
    failCount = 0;
    const banner = document.getElementById('banner');
    banner.classList.remove('show', 'restarting');
  } catch (e) {
    failCount++;
    if (failCount >= 2) {
      const banner = document.getElementById('banner');
      banner.textContent = 'Lost connection to bridge — retrying…';
      banner.classList.remove('restarting');
      banner.classList.add('show');
    }
  }
}

document.getElementById('wifi-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('wifi-msg');
  msg.textContent = '';
  msg.className = '';
  const ssid = document.getElementById('ssid').value;
  const password = document.getElementById('password').value;
  const channel = parseInt(document.getElementById('channel').value, 10);
  try {
    const res = await fetch('/api/wifi', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ssid, password, channel })
    });
    const data = await res.json();
    if (data.ok) {
      document.getElementById('password').value = '';
      const banner = document.getElementById('banner');
      banner.textContent = 'Saved — WiFi is restarting, reconnecting…';
      banner.classList.add('show', 'restarting');
      setTimeout(() => location.reload(), 3000);
    } else {
      msg.textContent = data.error || 'Failed to save';
      msg.className = 'error';
    }
  } catch (e) {
    msg.textContent = 'Could not reach the bridge';
    msg.className = 'error';
  }
});

document.getElementById('admin-login-btn').addEventListener('click', () => {
  location.href = '/admin';
});

document.getElementById('ota-file').addEventListener('change', (e) => {
  document.getElementById('ota-submit').disabled = !e.target.files.length;
});

document.getElementById('ota-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('ota-file');
  const file = fileInput.files[0];
  if (!file) return;
  if (!confirm('Flash "' + file.name + '" and reboot the device? This cannot be interrupted once started.')) {
    return;
  }

  const submitBtn = document.getElementById('ota-submit');
  const msg = document.getElementById('ota-msg');
  const bar = document.getElementById('ota-progress');
  msg.textContent = 'Uploading…';
  msg.className = '';
  bar.value = 0;
  bar.classList.add('show');
  fileInput.disabled = true;
  submitBtn.disabled = true;
  // The device's HTTP server handles one request at a time, so it can't
  // also answer the 1s status poll while this upload is streaming into
  // flash - suppress the "lost connection" banner for that expected gap
  // instead of letting it stomp on the upload progress UI.
  otaUploading = true;
  document.getElementById('banner').classList.remove('show', 'restarting');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/ota');
  xhr.setRequestHeader('Content-Type', 'application/octet-stream');

  xhr.upload.addEventListener('progress', (ev) => {
    if (ev.lengthComputable) {
      const pct = Math.round((ev.loaded / ev.total) * 100);
      bar.value = pct;
      msg.textContent = pct < 100 ? ('Uploading… ' + pct + '%') : 'Verifying and flashing…';
    }
  });

  xhr.onload = () => {
    let data;
    try {
      data = JSON.parse(xhr.responseText);
    } catch (e) {
      data = null;
    }
    if (data && data.ok) {
      bar.value = 100;
      msg.textContent = 'Flash successful — rebooting…';
      msg.className = 'ok';
      const banner = document.getElementById('banner');
      banner.textContent = 'Firmware updated — bridge is rebooting…';
      banner.classList.add('show', 'restarting');
      setTimeout(() => location.reload(), 5000);
    } else {
      otaUploading = false;
      msg.textContent = (data && data.error) || 'Flash failed';
      msg.className = 'error';
      bar.classList.remove('show');
      fileInput.disabled = false;
      submitBtn.disabled = false;
    }
  };

  xhr.onerror = () => {
    otaUploading = false;
    msg.textContent = 'Upload failed — could not reach the bridge';
    msg.className = 'error';
    bar.classList.remove('show');
    fileInput.disabled = false;
    submitBtn.disabled = false;
  };

  xhr.send(file);
});

loadStatus();
poll();
setInterval(poll, 1000);
</script>

</body>
</html>
